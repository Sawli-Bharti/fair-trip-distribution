spring.application.name=fair-trip-distribution

# JWT
app.jwt.secret=${JWT_SECRET:8a9b2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0}
app.jwt.expiration=86400000

# Actuator - expose only safe endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.exposure.exclude=env,beans,configprops,mappings,conditions,threaddump,heapdump,loggers,flyway,liquibase,integrationgraph,scheduledtasks,sessions,shutdown
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.health.redis.enabled=true
management.health.db.enabled=true
management.info.env.enabled=false

# App info (shown on /actuator/info)
info.app.name=Fair Trip Distribution
info.app.description=Vendor fairness allocation engine
info.app.version=1.0.0

# Logging
logging.level.com.example.fairtripdistribution=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.root=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Springdoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.show-actuator=false

# Suppress open-in-view warning (stateless REST API - no view rendering)
spring.jpa.open-in-view=false
